<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class 4 CSS Layout Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

   <nav id="percent-nav">
    Navigation
  </nav>
  <!-- No Layout (Normal Flow)
       Everything stacks naturally top to bottom -->
  <div id="box-1">Box 1</div>
  <div id="box-2">Box 2</div>
  <div id="box-3">Box 3</div>

  <div id="fancy-box">
    Fancy Box
  </div>

    <div id="parent">
    Parent
      <div id="child">Child</div>
  </div>

    <div id="fixed-box">
    Fixed Box
  </div>

   <img id="float-img" src="https://placehold.co/200x400/blue/FFF" alt="placeholder image">
  <p>
    This text wraps around the floated image. This is how float was originally intended to be used.
  </p>

  <div class="inline-box">Box A</div>
  <div class="inline-box">Box B</div>
  <div class="inline-box">Box C</div>

  <div id="flex-container">
    <div class="flex-item">1</div>
    <div class="flex-item">2</div>
    <div class="flex-item">3</div>
  </div>

  </body>
</html>
